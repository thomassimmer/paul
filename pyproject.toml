[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paul"
version = "0.1.0"
description = "Paul — apply more, apply better. Self-hosted assistant for job applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Shipped inside the wheel, so the licence travels with the code.
license-files = ["LICENSE"]
keywords = [
    "job-search",
    "resume",
    "cover-letter",
    "applicant-tracking",
    "llm",
    "self-hosted",
    "local-first",
]
# ``License ::`` is deliberately absent: it is not compatible with the SPDX
# expression above, and setuptools refuses the pair.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # CV import.
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Offer HTML cleaning.
    "beautifulsoup4>=4.12",
    # LiteLLM is the single entry point to every provider (OpenAI, Anthropic,
    # Mistral, Ollama, ...). Loaded lazily, only when a call is made.
    "litellm>=1.55",
]

[project.urls]
Homepage = "https://github.com/thomassimmer/paul"
Repository = "https://github.com/thomassimmer/paul"
Issues = "https://github.com/thomassimmer/paul/issues"

[project.optional-dependencies]
dev = [
    # The TestClient drives the app through httpx2, httpx's successor. With the
    # plain httpx package installed, Starlette warns on every import of it.
    "httpx2>=2.13",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    # The two gates run in CI (.github/workflows/ci.yml). Pin the linter no tighter
    # than needed here; ruff's own rule names are what the config below relies on.
    "ruff>=0.16",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Ship the templates and the prompts inside the wheel, so the app behaves the same
# from the source tree and from site-packages (Docker). The globs are spelled out
# per depth on purpose: setuptools does not recurse, so `**` would silently ship
# only the first level.
[tool.setuptools.package-data]
"app.web" = [
    "templates/*.html",
    "templates/*/*.html",
    "templates/*/*/*.html",
    "static/*",
]
"app.prompts" = [
    "*.md",
    "*/*.md",
    "*/*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

filterwarnings = [
    # Starlette 1.6.0 annotates its portal factory with the deprecated
    # ``anyio.abc.BlockingPortal`` alias, which anyio flags when the module is
    # imported. Already fixed on Starlette's master; drop this filter once a
    # release ships the fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

# Point the editor's Python tooling at the development virtualenv, so that
# third-party imports resolve ("pip install -e \".\[dev\]\"").
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# ``build/lib/app`` is a stale setuptools copy of the package, and the data
# directories hold user files rather than modules. Pyright reads neither
# .gitignore nor the linter's config, so it is told here.
exclude = ["build", "data", "demo-data"]

# Coverage is reported in CI, not gated: a threshold would let a number decide a
# review, and the branches that matter here (a provider answering something
# invalid, a template that will not open) are argued case by case.
[tool.coverage.run]
# What ships: the application and the two README scripts. The suite is the
# yardstick, not the thing measured, so tests/ is left out.
source = ["app", "scripts"]
# A line executed by the tests is not the same as a branch decided by them.
branch = true

# Lint rules. The set is spelled out instead of relying on ruff's defaults, so that
# a new ruff release cannot widen the gate in CI on its own.
[tool.ruff]
# 88 is ruff's default and would rewrap every import list the author keeps on one
# line; the code is written to a comfortable hundred. E501 stays off either way
# (see below), so this only decides where the import fixer and, if it is ever
# adopted, the formatter let a line end.
line-length = 100
target-version = "py312"
extend-exclude = ["build", "data", "demo-data"]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports, statements, syntax — not layout
    "E7",  # pycodestyle: statement and comparison mistakes
    "E9",  # pycodestyle: runtime errors (syntax, IO)
    "F",   # pyflakes: undefined and unused names
    "W",   # pycodestyle warnings
    "I",   # import order
    "UP",  # syntax the declared Python already allows (pyupgrade)
    "B",   # flake8-bugbear: likely bugs
    "C4",  # needlessly convoluted comprehensions
    "SIM", # simplifiable code
    "ISC", # implicit string concatenation, the missing-comma bug
    "BLE", # blind ``except Exception``
    "RUF", # ruff's own checks
]
# E501 stays out: how long a line may run is settled when it is wrapped by hand,
# and a long message, prompt or regex reads better on one line than broken up.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads ``Depends()``, ``File()`` and ``Form()`` in argument defaults. That
# is the framework's API, not a call performed at import time by accident.
"**/router.py" = ["B008"]
