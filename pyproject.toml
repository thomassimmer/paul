[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paul"
version = "0.1.0"
description = "Paul — apply more, apply better. Self-hosted assistant for job applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # CV import.
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Offer HTML cleaning.
    "beautifulsoup4>=4.12",
    # LiteLLM is the single entry point to every provider (OpenAI, Anthropic,
    # Mistral, Ollama, ...). Loaded lazily, only when a call is made.
    "litellm>=1.55",
]

[project.optional-dependencies]
dev = [
    # The TestClient drives the app through httpx2, httpx's successor. With the
    # plain httpx package installed, Starlette warns on every import of it.
    "httpx2>=2.13",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Ship the templates and the prompts inside the wheel, so the app behaves the same
# from the source tree and from site-packages (Docker). The globs are spelled out
# per depth on purpose: setuptools does not recurse, so `**` would silently ship
# only the first level.
[tool.setuptools.package-data]
"app.web" = [
    "templates/*.html",
    "templates/*/*.html",
    "templates/*/*/*.html",
    "static/*",
]
"app.prompts" = [
    "*.md",
    "*/*.md",
    "*/*/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

filterwarnings = [
    # Starlette 1.6.0 annotates its portal factory with the deprecated
    # ``anyio.abc.BlockingPortal`` alias, which anyio flags when the module is
    # imported. Already fixed on Starlette's master; drop this filter once a
    # release ships the fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

# Point the editor's Python tooling at the development virtualenv, so that
# third-party imports resolve ("pip install -e \".\[dev\]\"").
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
