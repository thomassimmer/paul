services:
  paul:
    build:
      context: .
      args:
        # WITH_PDF=0 docker compose build   -> smaller image, no LibreOffice
        WITH_PDF: "${WITH_PDF:-1}"
    image: paul
    container_name: paul
    ports:
      # The web UI has no authentication, so it is published on localhost only.
      # Do not change to 0.0.0.0 unless you add auth in front of it.
      - "127.0.0.1:8000:8000"
    volumes:
      # Profile, database, templates, application folders and settings (incl.
      # the API key) survive `docker compose up --build`.
      - ./data:/app/data
    environment:
      PAUL_DATA_DIR: /app/data
    restart: unless-stopped
