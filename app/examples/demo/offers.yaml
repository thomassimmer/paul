# Fictional workspace used by scripts/seed_demo.py, for screenshots, videos and
# manual checks. Every company and offer here is made up, and every number a
# justification quotes comes from app/examples/profile.example.yaml.
#
# The list is ordered best offer first, the way the board shows it. The seed
# inserts them in reverse: the board lists offers by descending id, so the last
# one written is the first one shown.

# Stored with the settings. The rules are checked against the offers below: only
# the last one matches, which is the eliminated row on the board.
settings:
  filter_rules: |
    Eliminate offers that explicitly require citizenship, a security clearance or a work permit.
    Eliminate offers that require fewer than 3 or more than 10 years of experience.
  wishes:
    - label: Full remote or hybrid in France
      weight: 2
    - label: Health-tech, scientific or regulated domain
      weight: 1.5
    - label: Mentoring and system design
      weight: 1

offers:
  - slug: sentinel-health-senior-backend-engineer
    html: sentinel-health-senior-backend-engineer.html
    url: https://example.com/jobs/sentinel-health-senior-backend-engineer
    status: ready
    prepared: true
    notes: |
      # Notes

      Referral: Nadia, from the platform team.

      Interview prep, first round:
      - they ask about the ingestion rebuild without downtime
      - the source of the 60% latency number
    open_answers:
      - >-
        Sentinel Health takes the reimbursement rules that clinics argue with today
        and turns them into software, which is the part of my work I keep coming
        back to. At Acme Analytics I rebuilt an ingestion path that could not go
        down while traffic doubled, and I cut end-to-end latency by 60% by batching
        writes and replacing a synchronous fan-out with a Kafka consumer group. I
        later led the migration of 40 services to a shared deployment pipeline, so I
        am comfortable owning a platform rather than a single service. A claims
        platform is also a system where the rules come from people who are not
        engineers, and working with the clinical team is the part of the posting I
        would want to start with.
    offer:
      title: Senior Backend Engineer
      company: Sentinel Health
      location: Paris, France
      remote_policy: Full remote in France
      contract_type: Permanent
      seniority: Senior, 5+ years
      salary: 70 000 – 85 000 € gross / year
      language: English
      responsibilities:
        - Own the claims ingestion and storage services end to end.
        - Design the data model behind the reimbursement rules.
        - Work directly with the clinical team to turn their rules into software.
        - Review, release and keep the pipeline observable with a team of six engineers.
      requirements:
        must_have:
          - 5+ years of backend experience on production systems.
          - Strong Rust and PostgreSQL.
          - Kafka, or another streaming platform, in production.
          - Kubernetes (K8s) and containerised deployments.
        nice_to_have:
          - FastAPI or another Python service framework.
          - Health data experience (HDS, GDPR article 9).
      keywords:
        - term: Rust
          variants: []
        - term: Kafka
          variants: []
        - term: PostgreSQL
          variants: [Postgres]
        - term: Kubernetes
          variants: [K8s]
        # Listed as a nice-to-have in the posting, and absent from the profile: the
        # report shows it as missing with the hint saying not to invent it.
        - term: HDS
          variants: []
      constraints:
        language_level: English, working proficiency
        on_site: One day a month in Paris
      company_info:
        size: 120 employees
        funding: Series B
        domain: Health-tech
        mission: Get clinics reimbursed faster.
    score:
      technical_match:
        score: 5
        justification: >-
          Rust, Kafka and PostgreSQL are all in your profile from Acme Analytics, and
          the migration of 40 services covers the Kubernetes requirement.
      seniority_scope:
        score: 5
        justification: >-
          You led a team of 7 engineers and owned the ingestion path end to end,
          which is the scope this role describes.
      wishes:
        score: 3
        justification: >-
          Full remote in France and the health-tech domain both match your list; the
          role is individual contributor, and you asked for more mentoring.
      red_flags:
        score: 5
        justification: none found

