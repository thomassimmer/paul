{# The preparation job, self-polling. The polling answer also refreshes the table,
   so a prepared row grows its "Review" link without a reload. #}
<div id="job-writing"{% if job and job.running %} hx-get="/progress/writing?sort={{ sort }}&dir={{ direction }}&status={{ status_filter }}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  {% include "writer/partials/job_body.html" %}
</div>
