<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paul{% endblock %} · Paul (Emploi)</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💼</text></svg>">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">Paul <span>Emploi</span></a>
    <nav>
      <a href="/" {% if active == 'home' %}class="active"{% endif %}>Dashboard</a>
      <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>Settings</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Local-first · data in <code>./data</code> · bound to <code>127.0.0.1</code>
  </footer>
</body>
</html>
