<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paul — {% block title %}apply more, apply better{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💼</text></svg>">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header>
    <div class="container">
      <a class="brand" href="/">Paul <span>· apply more, apply better</span></a>
      <nav>
        <a href="/" {% if active == 'offers' %}class="active"{% endif %}>Offers</a>
        <a href="/profiler" {% if active == 'profiler' %}class="active"{% endif %}>Profile</a>
        <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>

  {# The long pages put their quick navigation here; the other pages pass. #}
  <main class="container">
    {% block quick_nav %}{% endblock %}
    <div class="content">
      {% include "partials/flash.html" %}
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="container">
    Local-first · data in <code>./data</code> · bound to <code>127.0.0.1</code>
  </footer>

  <script>
    // The header is sticky and wraps, so its height is only known once the page is
    // laid out. Publish it so the quick navigation and the anchors below it leave
    // the right room; the stylesheet's fallback covers no-JS.
    (function () {
      var header = document.querySelector("header");
      if (!header) return;
      function place() {
        document.documentElement.style.setProperty("--nav-top", header.offsetHeight + "px");
      }
      place();
      window.addEventListener("resize", place);
    })();

    // Which section is being read: the last one whose heading has passed under the
    // header. Cheaper and more predictable than an observer band, and it survives
    // the offer page swapping this list when a preparation adds sections.
    (function () {
      function paint() {
        var nav = document.getElementById("quick-nav");
        if (!nav) return;
        var links = [];
        var targets = [];
        nav.querySelectorAll('a[href^="#"]').forEach(function (link) {
          var target = document.getElementById(link.hash.slice(1));
          if (!target) return;
          links.push(link);
          targets.push(target);
        });
        var header = document.querySelector("header");
        var offset = (header ? header.offsetHeight : 0) + 24;
        var current = 0;
        targets.forEach(function (target, index) {
          if (target.getBoundingClientRect().top - offset <= 0) current = index;
        });
        links.forEach(function (link, index) {
          link.classList.toggle("active", index === current);
        });
      }
      paint();
      window.addEventListener("scroll", paint, { passive: true });
      window.addEventListener("resize", paint);
      document.addEventListener("htmx:afterSwap", paint);
      document.addEventListener("htmx:oobAfterSwap", paint);
    })();

    // htmx swaps a region in place, and the reader is usually looking at it. A
    // browser that re-anchors the scroll when that region changes size would move
    // them; holding the position across the swap makes every in-place update — a
    // save, a job starting or landing — leave the page exactly where it was.
    (function () {
      var held = null;
      document.addEventListener("htmx:beforeSwap", function () {
        held = window.scrollY;
      });
      document.addEventListener("htmx:afterSettle", function () {
        if (held === null) return;
        var y = held;
        held = null;
        var restore = function () {
          if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
        };
        restore();
        // Some browsers move the scroll only on the frame after the swap.
        requestAnimationFrame(restore);
      });
    })();

    // The profile editor renders one blank row per list, so an entry can still be
    // added without JavaScript. When scripting is on, that empty row is captured
    // as a template instead, and "add another" appends a fresh empty row at the
    // end — below what was just filled, right above the button. Rows are
    // renumbered so the form stays sequential for the server, which reads a count
    // and indexes from 0.
    (function () {
      var lists = document.querySelectorAll("[data-row-list]");
      if (!lists.length) return;

      function rowsOf(list) {
        return list.querySelectorAll("[data-row]");
      }

      function renumber(list, prefix) {
        rowsOf(list).forEach(function (row, index) {
          row.querySelectorAll("[name]").forEach(function (field) {
            field.name = field.name.replace(/^[^.]+\.\d+\./, prefix + "." + index + ".");
          });
        });
        var count = list.querySelector('input[name="' + prefix + '_count"]');
        if (count) count.value = String(rowsOf(list).length);
      }

      lists.forEach(function (list) {
        var prefix = list.dataset.rowList;
        var button = list.querySelector("[data-add-row]");
        var rows = rowsOf(list);
        if (!button || !prefix || !rows.length) return;

        // The trailing row is the blank one. Capture it before the reader can fill
        // it in, so every added row starts empty whatever the last one holds.
        var template = rows[rows.length - 1].cloneNode(true);
        button.hidden = false;

        button.addEventListener("click", function () {
          var clone = template.cloneNode(true);
          clone.querySelectorAll("input, textarea").forEach(function (field) {
            field.value = "";
          });
          list.insertBefore(clone, button);
          renumber(list, prefix);
          var first = clone.querySelector("input:not([type='hidden']), textarea");
          if (first) first.focus();
        });
      });
    })();
  </script>
</body>
</html>
